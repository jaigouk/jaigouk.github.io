<!-- GHOST ICON — Drop these into your <head> -->

<!-- Favicon -->
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icon-16x16.png">

<!-- Apple -->
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

<!-- Android / PWA -->
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#32142c">

<!-- Social / Open Graph -->
<meta property="og:image" content="https://yourdomain.com/og-image.png">
<meta name="twitter:image" content="https://yourdomain.com/og-image.png">

<!-- Windows -->
<meta name="msapplication-TileImage" content="/icon-144x144.png">
<meta name="msapplication-TileColor" content="#32142c">

<!--
  FILES:
  favicon.ico               Browser tab (multi-size 16/32/48)
  apple-touch-icon.png      iOS home screen (180x180)
  android-chrome-192x192    Android / PWA
  android-chrome-512x512    PWA splash
  icon-master-1024.png      App Store / source master
  og-image.png              Social sharing (1200x630)
  site.webmanifest          PWA manifest (edit name/short_name)
  icon-{size}x{size}.png    Every standard size from 16 to 512
-->
